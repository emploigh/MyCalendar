:root{--df:"Dela Gothic One",-apple-system,"Segoe UI",Roboto,sans-serif;--acc:#0a84ff;--b1:#5aa2ff;--b2:#ff7ac3;--b3:#5ee6b0}
:root,[data-theme=light]{color-scheme:light;--fg:#14171f;--mut:#5d6677;--glass:rgba(255,255,255,.44);--gb:rgba(255,255,255,.7);--hi:rgba(255,255,255,.95);--sh:rgba(40,60,110,.16);--ln:rgba(20,30,60,.08);--ea:.32;--el:60%;--base:#eaf1ff;--bo:.55}
[data-theme=dark]{color-scheme:dark;--fg:#f2f4f9;--mut:#a3adc2;--glass:rgba(34,38,56,.46);--gb:rgba(255,255,255,.16);--hi:rgba(255,255,255,.26);--sh:rgba(0,0,0,.45);--ln:rgba(255,255,255,.08);--ea:.36;--el:64%;--base:#0b0e1b;--bo:.42}
[data-pal=ocean]{--acc:#0a84ff;--b1:#3d8bff;--b2:#7b7bff;--b3:#4fe0e8}
[data-pal=sunset]{--acc:#ff6a3d;--b1:#ff9a5a;--b2:#ff5a8a;--b3:#ffd35a}
[data-pal=foret]{--acc:#1fa86a;--b1:#4fd18b;--b2:#2aa8a0;--b3:#b4e05a}
[data-pal=aurore]{--acc:#7c5cff;--b1:#5aa2ff;--b2:#ff7ac3;--b3:#5ee6b0}
*{font-weight:400;font-synthesis:none;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--fg);font:13.5px/1.4 var(--df);background:var(--base);padding:calc(76px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom))}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--base)}
.bg i{position:absolute;width:58vmax;height:58vmax;border-radius:50%;filter:blur(72px);opacity:var(--bo);animation:f 26s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--b1);left:-15%;top:-22%}.bg i:nth-child(2){background:var(--b2);right:-22%;top:18%;animation-delay:-9s}.bg i:nth-child(3){background:var(--b3);left:18%;bottom:-32%;animation-delay:-16s}
@keyframes f{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.05),0 12px 36px var(--sh)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
header{position:fixed;z-index:10;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));height:56px;border-radius:28px;display:flex;align-items:center;gap:8px;padding:0 9px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font:20px var(--df);color:#fff;background:linear-gradient(135deg,var(--acc),var(--b2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px var(--sh)}
#title{flex:1;text-align:center;font:14px var(--df);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.ic{width:38px;height:38px;border-radius:50%;font-size:17px;background:rgba(255,255,255,.2);border:1px solid var(--gb)}
#next{display:none;width:100%;text-align:left;margin:0 0 10px;padding:12px 16px;border-radius:24px;align-items:center;gap:12px}
#next.show{display:flex}
#next .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 25%,transparent);flex:none}
#next b{display:block;font:14px var(--df)}#next small{color:var(--mut);font-size:11.5px}
#status{text-align:center;font-size:11px;color:var(--mut);margin:0 0 8px}
#wrap{overflow-x:auto;border-radius:30px}
#grid{display:grid;border-radius:30px;overflow:hidden;position:relative}
#grid.wide{min-width:760px}
.hd{padding:10px 4px 8px;text-align:center;border-bottom:1px solid var(--ln);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.hd b{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:17px;margin-top:3px;font:17px var(--df);color:var(--fg);letter-spacing:0}
.hd.today b{background:var(--acc);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 50%,transparent)}
.bn{font-size:9.5px;margin:4px 4px 0;padding:2px 7px;border-radius:9px;background:rgba(255,170,60,.3);color:var(--fg);text-transform:none;letter-spacing:0}
.hours{position:relative}.hours span{position:absolute;right:5px;font-size:9.5px;color:var(--mut);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--ln)}.ln{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}
.ev{position:absolute;overflow:hidden;border-radius:15px;padding:6px 9px;font-size:11px;line-height:1.3;cursor:pointer;color:var(--fg);background:linear-gradient(160deg,hsl(var(--h) 90% var(--el)/calc(var(--ea) + .1)),hsl(var(--h) 90% var(--el)/var(--ea)));border:1px solid hsl(var(--h) 95% 75%/.6);box-shadow:inset 0 1px 0 var(--hi),inset 3px 0 0 hsl(var(--h) 85% 55%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s,box-shadow .15s}
.ev:hover{transform:translateY(-1px) scale(1.01);z-index:4;box-shadow:inset 0 1px 0 var(--hi),inset 3px 0 0 hsl(var(--h) 85% 55%),0 8px 20px var(--sh)}
.ev b{display:block;font:11.5px var(--df);letter-spacing:.1px}.ev i{font-style:normal;color:var(--mut);font-size:10px}
.ev.note:after{content:"";position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.now{position:absolute;left:0;right:0;height:2px;background:#ff453a;z-index:3;border-radius:2px}
.now:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ff453a}
.dock{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;padding:7px;border-radius:32px;max-width:calc(100% - 16px)}
.dock>button{padding:10px 14px;border-radius:22px;font-size:12px}
.seg{display:flex;background:rgba(120,130,160,.18);border-radius:23px;padding:3px}
.seg button{padding:8px 11px;border-radius:20px;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--glass);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--sh);border:1px solid var(--gb)}
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:rgba(10,15,35,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ov.show{display:grid}
.card{width:min(460px,100%);border-radius:32px;padding:22px;max-height:88vh;overflow:auto}
.card h2{margin:0 0 6px;font:21px/1.15 var(--df)}.card p{margin:2px 0 12px;color:var(--mut)}
.card h3{margin:18px 0 8px;font:12px var(--df);text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
.card pre{white-space:pre-wrap;font:inherit;margin:6px 0 10px}
.btn{display:inline-block;margin:10px 8px 0 0;padding:10px 16px;border-radius:20px;background:var(--acc);color:#fff;}
.btn.g{background:rgba(120,130,160,.22);color:var(--fg)}
textarea{width:100%;min-height:78px;resize:vertical;border-radius:18px;padding:11px 13px;font:inherit;color:var(--fg);background:rgba(120,130,160,.16);border:1px solid var(--gb);outline:0}
textarea:focus{border-color:var(--acc)}
.pals{display:flex;gap:10px}.pals button{width:42px;height:42px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.pals button.on{border-color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.row button{padding:5px 12px;border-radius:16px;background:rgba(120,130,160,.22);font-size:13px}
.s{display:none}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(120,130,160,.35);position:relative;padding:0!important}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}.sw.on:after{left:21px}
code{background:rgba(120,130,160,.2);padding:1px 5px;border-radius:6px}
@media (max-width:700px){.l{display:none}.s{display:inline}.dock{gap:2px;padding:6px}.dock>button{padding:9px 10px;font-size:11px}.seg button{padding:8px 9px;font-size:11px}.ev{font-size:10.5px}body{padding-left:8px;padding-right:8px}header{left:8px;right:8px}.hd b{min-width:28px;height:28px;font-size:14px}.ev{padding:5px 7px;font-size:11.5px}.dock>button{padding:9px 11px}.seg button{padding:7px 9px}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header class="glass">
  <div class="logo">G</div>
  <div id="title"></div>
  <button class="ic" id="reload" aria-label="Actualiser">↻</button>
  <button class="ic" id="gear" aria-label="Réglages">⚙︎</button>
</header>
<button id="next" class="glass"><span class="dot"></span><span><b id="nb"></b><small id="ns"></small></span></button>
<div id="status"></div>
<main id="wrap" class="glass"><div id="grid"></div></main>
<nav class="dock glass">
  <button id="prev" aria-label="Précédent">‹</button>
  <button id="today"><span class="l">Aujourd’hui</span><span class="s">Auj.</span></button>
  <button id="nxt" aria-label="Suivant">›</button>
  <div class="seg" id="seg"><button data-s="1"><span class="l">Jour</span><span class="s">1 j</span></button><button data-s="2"><span class="l">2 jours</span><span class="s">2 j</span></button><button data-s="5"><span class="l">Semaine</span><span class="s">Sem.</span></button></div>
</nav>
<div class="ov" id="ovEv"><div class="card glass">
  <h2 id="dt"></h2><p id="dw"></p><p id="dl" style="margin-top:-8px"></p><pre id="dd"></pre>
  <h3>Ma note</h3><textarea id="note" placeholder="Devoirs, matériel à apporter…"></textarea>
  <button class="btn" id="cl">Fermer</button><button class="btn g" id="hide">Masquer cette matière</button>
</div></div>
<div class="ov" id="ovSet"><div class="card glass" id="setCard"></div></div>

<script>
const TZ="Europe/Paris",PX=54,FILE="G.ics",$=id=>document.getElementById(id),K="edt-v2";
let events=[],anchor="",curEv=null,S={theme:"auto",pal:"aurore",hidden:[],notes:{},next:true,span:innerWidth<700?2:5};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const mq=matchMedia("(prefers-color-scheme:dark)");
function theme(){const r=document.documentElement;r.dataset.theme=S.theme==="auto"?(mq.matches?"dark":"light"):S.theme;r.dataset.pal=S.pal}
mq.addEventListener&&mq.addEventListener("change",theme);theme();

/* dates */
const fmt=new Intl.DateTimeFormat("fr-FR",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function parts(d){const o={};fmt.formatToParts(d).forEach(p=>o[p.type]=p.value);return{day:o.year+"-"+o.month+"-"+o.day,min:+o.hour*60+ +o.minute}}
const D=s=>new Date(s+"T12:00:00Z"),addD=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const isWE=s=>[0,6].includes(D(s).getUTCDay()),nextWD=(s,k)=>{do{s=addD(s,k)}while(isWE(s));return s},norm=s=>{while(isWE(s))s=addD(s,1);return s};
const monOf=s=>addD(s,-((D(s).getUTCDay()+6)%7)),L=(s,o)=>D(s).toLocaleDateString("fr-FR",Object.assign({timeZone:"UTC"},o));
const hm=d=>d.toLocaleTimeString("fr-FR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});

/* ics */
function pd(s){const m=s&&s.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z?/);return m?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6])):null}
function parse(txt){
  txt=txt.replace(/\r?\n[ \t]/g,"");const out=[];
  txt.split("BEGIN:VEVENT").slice(1).forEach(b=>{
    b=b.split("END:VEVENT")[0];
    const g=k=>{const m=b.match(new RegExp("^"+k+"[^:\\n]*:(.*)$","m"));return m?m[1].replace(/\r$/,"").replace(/\\,/g,",").replace(/\\n/g,"\n").replace(/\\;/g,";"):""};
    const s=pd(g("DTSTART")),e=pd(g("DTEND"));if(!s||!e)return;
    const raw=g("SUMMARY"),lines=g("DESCRIPTION").split("\n").map(x=>x.trim()).filter(x=>x&&!/^\(Exported/.test(x)&&!/^S\d+\s*-/i.test(x)&&!/^S0?\d-/.test(x));
    out.push({s,e,name:raw.replace(/^#/,"").replace(/_(FGHKL|EFGHKL|FGH|G\d?|TD_FGHKL)$/,"").replace(/_/g," "),loc:g("LOCATION"),desc:lines.join("\n"),ps:parts(s),pe:parts(e),long:(e-s)>10*3600e3});
  });
  return out.sort((a,b)=>a.s-b.s);
}
const hue=str=>{let h=0;for(const c of str.replace(/[^a-zA-Zéè ]/g,"").toLowerCase().split(" ")[0])h=(h*31+c.charCodeAt(0))%360;return h};
const vis=()=>events.filter(e=>!S.hidden.includes(e.name)),nkey=e=>e.name+"|"+e.s.getTime();

/* vue */
function visible(){
  if(S.span<5){const a=[norm(anchor)];while(a.length<S.span)a.push(nextWD(a[a.length-1],1));return a}
  const m=monOf(anchor),a=[0,1,2,3,4].map(i=>addD(m,i)),v=vis();
  if(v.some(e=>!e.long&&(e.ps.day===addD(m,5)||e.ps.day===addD(m,6))))a.push(addD(m,5),addD(m,6));
  return a;
}
function render(){
  const days=visible(),g=$("grid"),today=parts(new Date()).day,v=vis();g.innerHTML="";
  g.className=S.span===5?"wide":"";g.style.gridTemplateColumns=(innerWidth<700?"34px":"44px")+" repeat("+days.length+",minmax(0,1fr))";
  const first=days[0],last=days[days.length-1];
  $("title").textContent=days.length===1?L(first,{weekday:"long",day:"numeric",month:"long"}):L(first,{day:"numeric",month:"short"})+" – "+L(last,{day:"numeric",month:"short"});
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",+b.dataset.s===S.span));
  const ev=v.filter(e=>!e.long&&days.includes(e.ps.day));
  const H0=Math.min(8,...ev.map(e=>Math.floor(e.ps.min/60))),H1=Math.max(18,...ev.map(e=>Math.ceil(e.pe.min/60)));
  g.appendChild(document.createElement("div")).className="hd";
  days.forEach(k=>{
    const h=document.createElement("div");h.className="hd"+(k===today?" today":"");
    h.innerHTML=L(k,{weekday:"short"})+"<br><b>"+(+k.slice(8))+"</b>";
    v.filter(e=>e.long&&e.ps.day<=k&&e.pe.day>=k).forEach(e=>{const b=document.createElement("div");b.className="bn";b.textContent=e.name;h.appendChild(b)});
    g.appendChild(h);
  });
  const hrs=document.createElement("div");hrs.className="hours";hrs.style.height=(H1-H0)*PX+"px";
  for(let h=H0;h<=H1;h++){const s=document.createElement("span");s.style.top=(h-H0)*PX+"px";s.textContent=h+"h";hrs.appendChild(s)}
  g.appendChild(hrs);
  days.forEach(k=>{
    const col=document.createElement("div");col.className="col";col.style.height=(H1-H0)*PX+"px";
    for(let h=H0;h<H1;h++){const l=document.createElement("div");l.className="ln";l.style.top=(h-H0)*PX+"px";col.appendChild(l)}
    const evs=ev.filter(e=>e.ps.day===k),cols=[];
    evs.forEach(e=>{let i=0;while(cols[i]&&cols[i]>e.ps.min)i++;cols[i]=e.pe.min;e.c=i});
    evs.forEach(e=>{
      const n=Math.max(...evs.filter(o=>o.ps.min<e.pe.min&&o.pe.min>e.ps.min).map(o=>o.c))+1,el=document.createElement("div");
      el.className="ev"+(S.notes[nkey(e)]?" note":"");el.style.setProperty("--h",hue(e.name));
      el.style.top=(e.ps.min/60-H0)*PX+1+"px";el.style.height=Math.max(24,(e.pe.min-e.ps.min)/60*PX-3)+"px";
      el.style.left="calc("+(e.c/n*100)+"% + 3px)";el.style.width="calc("+100/n+"% - 6px)";
      el.innerHTML="<b></b><i></i>";el.firstChild.textContent=e.name;el.lastChild.textContent=hm(e.s)+"–"+hm(e.e)+(e.loc?" · "+e.loc:"");
      el.onclick=()=>openEv(e);col.appendChild(el);
    });
    if(k===today){const m=parts(new Date()).min;if(m>=H0*60&&m<=H1*60){const n=document.createElement("div");n.className="now";n.style.top=(m/60-H0)*PX+"px";col.appendChild(n)}}
    g.appendChild(col);
  });
  upNext();
}
function go(dir){anchor=S.span===5?addD(anchor,7*dir):(()=>{let a=norm(anchor);for(let i=0;i<S.span;i++)a=nextWD(a,dir);return a})();render()}
function openEv(e){
  curEv=e;$("dt").textContent=e.name;$("dw").textContent=L(e.ps.day,{weekday:"long",day:"numeric",month:"long"})+", "+hm(e.s)+" – "+hm(e.e);
  $("dl").textContent=e.loc?"📍 "+e.loc:"";$("dd").textContent=e.desc;$("note").value=S.notes[nkey(e)]||"";$("ovEv").classList.add("show");
}
function closeEv(){$("ovEv").classList.remove("show");render()}

/* prochain cours */
const dur=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?m+" min":Math.floor(m/60)+" h"+(m%60?" "+String(m%60).padStart(2,"0"):"")};
function upNext(){
  const b=$("next");if(!S.next||!events.length){b.classList.remove("show");return}
  const now=new Date(),v=vis().filter(e=>!e.long),c=v.find(e=>e.s<=now&&e.e>now),n=v.find(e=>e.s>now),e=c||n;
  if(!e){b.classList.remove("show");return}
  $("nb").textContent=(c?"En cours · ":"Prochain · ")+e.name;
  const when=c?"fin dans "+dur(e.e-now):(e.ps.day===parts(now).day?"dans "+dur(e.s-now):L(e.ps.day,{weekday:"long"})+" à "+hm(e.s));
  $("ns").textContent=when+(e.loc?" · "+e.loc:"");b.classList.add("show");b.onclick=()=>openEv(e);
}

/* réglages */
function setUI(){
  const c=$("setCard"),pal={aurore:["#5aa2ff","#ff7ac3"],ocean:["#3d8bff","#4fe0e8"],sunset:["#ff9a5a","#ff5a8a"],foret:["#4fd18b","#b4e05a"]};
  c.innerHTML="<h2>Réglages</h2><h3>Thème</h3><div class=seg id=th>"+[["auto","Auto"],["light","Clair"],["dark","Sombre"]].map(t=>"<button data-t="+t[0]+(S.theme===t[0]?" class=on":"")+">"+t[1]+"</button>").join("")+"</div><h3>Couleurs</h3><div class=pals>"+Object.keys(pal).map(p=>"<button data-p="+p+(S.pal===p?" class=on":"")+" style=\"background:linear-gradient(135deg,"+pal[p][0]+","+pal[p][1]+")\" aria-label="+p+"></button>").join("")+"</div><h3>Affichage</h3><div class=row><span>Bandeau « Prochain cours »</span><button class=\"sw"+(S.next?" on":"")+"\" id=swn></button></div><h3>Matières masquées</h3>"+(S.hidden.length?S.hidden.map((h,i)=>"<div class=row><span>"+h.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</span><button data-r="+i+">Afficher</button></div>").join(""):"<p>Aucune. Ouvre un cours puis « Masquer cette matière » pour cacher une option qui ne te concerne pas.</p>")+"<h3>Données</h3><p>Réglages et notes enregistrés sur cet appareil.</p><button class=\"btn g\" id=rst>Tout réinitialiser</button><button class=btn id=ok>Fermer</button>";
}
$("setCard").onclick=e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.t){S.theme=t.dataset.t;theme()}else if(t.dataset.p){S.pal=t.dataset.p;theme()}
  else if(t.id==="swn")S.next=!S.next;else if(t.dataset.r)S.hidden.splice(+t.dataset.r,1);
  else if(t.id==="rst"){if(confirm("Effacer réglages et notes ?")){S={theme:"auto",pal:"aurore",hidden:[],notes:{},next:true,span:S.span};theme()}}
  else if(t.id==="ok"){$("ovSet").classList.remove("show");render();return}
  save();setUI();render();
};

/* fichier */
function use(txt,label){events=parse(txt);$("status").textContent=events.length+" événements · "+label;$("ovSet").classList.remove("show");render()}
async function loadCur(silent){
  if(!silent)$("status").textContent="Chargement…";
  try{
    const r=await fetch(FILE+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
    const txt=await r.text();if(!txt.includes("BEGIN:VCALENDAR"))throw 0;
    use(txt,"mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    $("status").textContent=events.length?"Impossible de relire "+FILE+" · dernière version affichée":"Impossible de lire "+FILE;
    if(!events.length){
      const c=$("setCard");
      c.innerHTML="<h2>"+FILE+" introuvable</h2><p>Ouvre cette page depuis un site (ou un serveur local) avec <code>"+FILE+"</code> dans le même dossier. En attendant, tu peux l’ouvrir à la main :</p><label class=btn>Ouvrir "+FILE+"<input id=imp type=file accept=\".ics,text/calendar\" hidden></label>";
      $("imp").onchange=async ev=>{const f=ev.target.files[0];if(f){use(await f.text(),"ouvert à la main");setUI()}};
      $("ovSet").classList.add("show");
    }
  }
}

$("reload").onclick=()=>loadCur();$("gear").onclick=()=>{setUI();$("ovSet").classList.add("show")};
$("prev").onclick=()=>go(-1);$("nxt").onclick=()=>go(1);
$("today").onclick=()=>{anchor=norm(parts(new Date()).day);render()};
$("seg").onclick=e=>{const b=e.target.closest("button"),s=b?+b.dataset.s:0;if(s){S.span=s;save();render()}};
$("cl").onclick=closeEv;$("ovEv").onclick=e=>{if(e.target.id==="ovEv")closeEv()};
$("ovSet").onclick=e=>{if(e.target.id==="ovSet"&&events.length){$("ovSet").classList.remove("show")}};
$("note").oninput=e=>{const k=nkey(curEv),v=e.target.value.trim();if(v)S.notes[k]=v;else delete S.notes[k];save()};
$("hide").onclick=()=>{if(!S.hidden.includes(curEv.name))S.hidden.push(curEv.name);save();closeEv()};
let sx=0;$("wrap").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("wrap").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(S.span<5&&Math.abs(dx)>70)go(dx<0?1:-1)});
setInterval(()=>{if(!document.hidden){loadCur(true);upNext()}},120000);setInterval(upNext,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadCur(true)});
anchor=norm(parts(new Date()).day);render();loadCur();
</script>
</body>
</html>
